<style>
/* Layout: a phone-first arcade hub — one column of game cards, each game opens full-width with a back bar. */
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --ink:#11212C; --muted:#5A6B77; --line:#D3DCE3; --soft:#E4EAF0;
  --pop:#D99A12; --mean:#2B55E0; --mean-soft:#DCE4FC; --curve:#C2185B; --ok:#1B8A5A; --bad:#C23A2B;
  --t1:#2B55E0; --t2:#C2185B; --t3:#1B8A5A; --t4:#D99A12; --on-accent:#FFFFFF;
  --display:"Bricolage Grotesque","Vazirmatn","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Vazirmatn","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161D; --panel:#15212A; --ink:#E7EEF3; --muted:#93A4B1; --line:#283844; --soft:#1C2A35;
  --pop:#F0B53A; --mean:#7C9BFF; --mean-soft:#1E2B55; --curve:#FF6FA5; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#7C9BFF; --t2:#FF6FA5; --t3:#4CC98D; --t4:#F0B53A; --on-accent:#0D161D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161D; --panel:#15212A; --ink:#E7EEF3; --muted:#93A4B1; --line:#283844; --soft:#1C2A35;
  --pop:#F0B53A; --mean:#7C9BFF; --mean-soft:#1E2B55; --curve:#FF6FA5; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#7C9BFF; --t2:#FF6FA5; --t3:#4CC98D; --t4:#F0B53A; --on-accent:#0D161D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{font:inherit;font-size:.86rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.tag{font-family:var(--mono);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.star{background:var(--mean-soft);color:var(--mean)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mean);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--mean);color:var(--on-accent);font-size:.98rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:.9rem;padding:9px 14px}
.btn.warn{background:var(--curve)}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-family:var(--mono);font-size:.86rem;border:0;background:transparent;color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mean);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--mean)}
input[type=search],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
svg{display:block;width:100%;height:auto;max-width:100%}
.axis{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800;color:var(--mean);line-height:1;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.status{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.live .led{background:var(--ok)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard:hover{border-color:var(--mean)}
.gcard p{font-size:.86rem;color:var(--muted)}
.gcard .best{font-family:var(--mono);font-size:.75rem;color:var(--ok)}
.board{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
.stem{font-size:1rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 14px;cursor:pointer}
.choice:hover:not([disabled]){border-color:var(--mean)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.choice[disabled]{cursor:default}
.feedback{border-left:4px solid var(--ok);padding:10px 12px;background:var(--bg);border-radius:0 10px 10px 0}
.feedback.no{border-left-color:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--mean)}
.role{font-family:var(--mono);font-size:.75rem;padding:3px 10px;border-radius:999px;background:var(--mean-soft);color:var(--mean);align-self:flex-start}
table.t{border-collapse:collapse;width:100%;font-size:.85rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.drop{animation:drop .45s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.drop{animation:none}}
@media (max-width:440px){h1{font-size:1.85rem}.games{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* right-to-left (Farsi, Arabic) */
[dir="rtl"] body{font-family:"Vazirmatn",var(--body)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Vazirmatn",var(--display)}
[dir="rtl"] .eyebrow,[dir="rtl"] .tag{letter-spacing:0;text-transform:none}
.gcard,.choice{text-align:start}
.feedback{border-left:0;border-inline-start:4px solid var(--ok);border-radius:10px}
.feedback.no{border-inline-start-color:var(--bad)}
[dir="rtl"] ul,[dir="rtl"] ol{padding-left:0!important;padding-right:20px!important}
svg,input[type=range],.num,.seg,.stat b,.big{direction:ltr}
[dir="rtl"] .stat b,[dir="rtl"] .big{text-align:right}
:lang(zh) .eyebrow,:lang(zh) .tag{letter-spacing:0;text-transform:none}
[dir="rtl"] .eyebrow,[dir="rtl"] .tag,[dir="rtl"] .role,[dir="rtl"] .num,[dir="rtl"] .seg button,[dir="rtl"] .axis{font-family:"Vazirmatn",var(--body)}
:lang(zh) .eyebrow,:lang(zh) .tag,:lang(zh) .role{font-family:var(--body)}
[dir="rtl"] .choice{unicode-bidi:plaintext}
</style>

SS_DICT.zh={"(blank)": "（空白）", "<0></0>Team Bayes": "<0></0>贝叶斯队", "<0></0>Team Fisher": "<0></0>费希尔队", "<0></0>Team Gauss": "<0></0>高斯队", "<0></0>Team Nightingale": "<0></0>南丁格尔队", "<0>Android (Chrome):</0> tap the <1>⋮</1> menu → <2>Add to home screen</2> (or <3>Install app</3>) → choose <4>Install</4>, not “Create shortcut”.": "<0>Android（Chrome）：</0>点按 <1>⋮</1> 菜单 → <2>添加到主屏幕</2>（或<3>安装应用</3>）→ 选择<4>安装</4>，不要选“创建快捷方式”。", "<0>Android:</0> Chrome → ⋮ → Add to home screen → Install": "<0>Android：</0>Chrome → ⋮ → 添加到主屏幕 → 安装", "<0>Check your understanding.</0> Use the sliders to help.": "<0>检验你的理解。</0>可以借助滑块。", "<0>Check your understanding</0> after hunting a few intervals.": "先找几个区间，再<0>检验你的理解</0>。", "<0>Check your understanding</0> after trying different k and K values.": "试过不同的 k 和 K 值后，<0>检验你的理解</0>。", "<0>Check your understanding</0> once the votes are in.": "投票结束后，<0>检验你的理解</0>。", "<0>Feedback form.</0> If you choose to send feedback, the form service processes what you type. Please don't include sensitive personal information.": "<0>反馈表。</0>如果你选择提交反馈，表单服务会处理你填写的内容。请不要填写敏感的个人信息。", "<0>Fertiliser dose (randomly assigned to plots)</0> vs <1>Crop yield</1>": "<0>施肥量（随机分配到各地块）</0>与<1>作物产量</1>", "<0>Fonts.</0> The app loads its fonts from Google Fonts, so Google receives your IP address when the fonts are downloaded.": "<0>字体。</0>本应用从 Google Fonts 加载字体，因此下载字体时 Google 会收到你的 IP 地址。", "<0>Hint {0}:</0> A bigger sample doesn't fix a biased way of choosing people.": "<0>提示 {0}：</0>样本再大，也无法弥补有偏的抽样方式。", "<0>Hint {0}:</0> A cloud with no direction means r is near {1}.": "<0>提示 {0}：</0>没有方向的点云意味着 r 接近 {1}。", "<0>Hint {0}:</0> A fair die gives each face about {1}/{2} (the red line) in the long run.": "<0>提示 {0}：</0>公平的骰子长期来看每一面约占 {1}/{2}（红线）。", "<0>Hint {0}:</0> A smaller sum of squared residuals is better.": "<0>提示 {0}：</0>残差平方和越小越好。", "<0>Hint {0}:</0> A variable linked to a protected group can act as a proxy.": "<0>提示 {0}：</0>与受保护群体相关的变量可能充当代理变量。", "<0>Hint {0}:</0> About {1} of {2} intervals capture the true mean.": "<0>提示 {0}：</0>{2} 的区间中约有 {1} 能覆盖真实均值。", "<0>Hint {0}:</0> After {1}+ rolls, a small p-value is evidence the die isn't fair.": "<0>提示 {0}：</0>掷 {1}+ 次后，较小的 p 值说明骰子不公平。", "<0>Hint {0}:</0> Ask which group got the harder cases.": "<0>提示 {0}：</0>想想哪一组接手了更难的病例。", "<0>Hint {0}:</0> Ask: who could never be picked, or who chose to take part? That's usually where the bias is.": "<0>提示 {0}：</0>问问自己：谁根本不可能被选中？谁是自愿参与的？偏差通常就在那里。", "<0>Hint {0}:</0> Bigger samples = narrower intervals.": "<0>提示 {0}：</0>样本越大 = 区间越窄。", "<0>Hint {0}:</0> Bigger z = more exceptional compared with their own field.": "<0>提示 {0}：</0>z 越大 = 相对其项目的选手越出众。", "<0>Hint {0}:</0> Binomial: fixed number of yes/no trials with the same chance each time.": "<0>提示 {0}：</0>二项分布：固定次数的是/否试验，每次成功概率相同。", "<0>Hint {0}:</0> Check the spacing of time on the x-axis.": "<0>提示 {0}：</0>检查 x 轴上的时间间隔。", "<0>Hint {0}:</0> Check where the y-axis starts.": "<0>提示 {0}：</0>检查 y 轴从哪里开始。", "<0>Hint {0}:</0> Compare outcomes and errors between groups.": "<0>提示 {0}：</0>比较各组的结果和错误率。", "<0>Hint {0}:</0> Compare rates (%), not counts.": "<0>提示 {0}：</0>比较比率（%），不要比较人数。", "<0>Hint {0}:</0> Count true positives (sick and positive) and false positives (healthy and positive).": "<0>提示 {0}：</0>数出真阳性（患病且阳性）和假阳性（健康但阳性）。", "<0>Hint {0}:</0> Each coefficient b multiplies the odds by e^b.": "<0>提示 {0}：</0>每个系数 b 都会让优势乘以 e^b。", "<0>Hint {0}:</0> Expected value = sum of (value × probability).": "<0>提示 {0}：</0>期望值 = Σ（数值 × 概率）。", "<0>Hint {0}:</0> Experiment = researchers assign the treatment at random. Otherwise it's observational.": "<0>提示 {0}：</0>实验 = 研究者随机分配处理；否则就是观察性研究。", "<0>Hint {0}:</0> For a target mean: total = mean × number of values.": "<0>提示 {0}：</0>要达到目标均值：总和 = 均值 × 数据个数。", "<0>Hint {0}:</0> For k-means, look for the elbow where adding clusters stops helping.": "<0>提示 {0}：</0>对 k 均值，找“肘部”：再增加簇也帮助不大的位置。", "<0>Hint {0}:</0> For running times, lower is better, so flip the sign.": "<0>提示 {0}：</0>跑步成绩越低越好，所以要把符号反过来。", "<0>Hint {0}:</0> Get the slope right first, then shift the line up or down.": "<0>提示 {0}：</0>先调准斜率，再把直线上下平移。", "<0>Hint {0}:</0> Higher confidence = wider intervals.": "<0>提示 {0}：</0>置信水平越高 = 区间越宽。", "<0>Hint {0}:</0> H₀ is about a population parameter (μ or p), never the sample result.": "<0>提示 {0}：</0>H₀ 针对总体参数（μ 或 p），而不是样本结果。", "<0>Hint {0}:</0> Imagine {1} people. How many have the disease?": "<0>提示 {0}：</0>想象 {1} 个人。其中有多少人患病？", "<0>Hint {0}:</0> Judge by test RMSE: it shows how well you predict new students.": "<0>提示 {0}：</0>用测试集 RMSE 评判：它反映你预测新学生的能力。", "<0>Hint {0}:</0> Large p-values suggest a predictor isn't helping.": "<0>提示 {0}：</0>p 值大说明该预测变量帮助不大。", "<0>Hint {0}:</0> Larger n makes the pile of means narrower.": "<0>提示 {0}：</0>n 越大，均值堆越窄。", "<0>Hint {0}:</0> Look at the p-value on the Fertiliser × Light row.": "<0>提示 {0}：</0>看“施肥 × 光照”那一行的 p 值。", "<0>Hint {0}:</0> Look for repeated rows, odd spellings, impossible values and mixed units.": "<0>提示 {0}：</0>寻找重复的行、奇怪的拼写、不可能的数值和混用的单位。", "<0>Hint {0}:</0> Missing isn't the same as zero.": "<0>提示 {0}：</0>缺失不等于零。", "<0>Hint {0}:</0> More plants per group = more power to detect real effects.": "<0>提示 {0}：</0>每组植物越多 = 检验真实效应的功效越高。", "<0>Hint {0}:</0> Numbers → t-test or ANOVA. Categories → proportion or chi-square test.": "<0>提示 {0}：</0>数值型 → t 检验或方差分析。分类型 → 比例检验或卡方检验。", "<0>Hint {0}:</0> Odds = p ÷ ({1} − p).": "<0>提示 {0}：</0>优势 = p ÷ ({1} − p)。", "<0>Hint {0}:</0> One yes/no question vs a claimed % → one-sample proportion test.": "<0>提示 {0}：</0>一个是/否问题对比声称的百分比 → 单样本比例检验。", "<0>Hint {0}:</0> Only a randomised experiment supports cause and effect.": "<0>提示 {0}：</0>只有随机实验才能支持因果结论。", "<0>Hint {0}:</0> Parallel lines in the plot = no interaction.": "<0>提示 {0}：</0>图中线条平行 = 没有交互作用。", "<0>Hint {0}:</0> Points close to a straight line mean r is near {1} or {2}.": "<0>提示 {0}：</0>点紧贴一条直线意味着 r 接近 {1} 或 {2}。", "<0>Hint {0}:</0> Poisson: counts of events at an average rate per time or space.": "<0>提示 {0}：</0>泊松分布：单位时间或空间内以平均速率发生的事件次数。", "<0>Hint {0}:</0> Probability = {1} ÷ ({2} + e^(−log-odds)).": "<0>提示 {0}：</0>概率 = {1} ÷ ({2} + e^(−对数优势))。", "<0>Hint {0}:</0> Reject H₀ only when p < α.": "<0>提示 {0}：</0>只有当 p < α 时才拒绝 H₀。", "<0>Hint {0}:</0> Residual plot: random scatter = good; a curve or one far point = problem.": "<0>提示 {0}：</0>残差图：随机散布 = 良好；出现弯曲或一个远离的点 = 有问题。", "<0>Hint {0}:</0> Same people measured twice → paired.": "<0>提示 {0}：</0>同一批人测两次 → 配对。", "<0>Hint {0}:</0> Several categories vs equal shares → chi-square goodness-of-fit.": "<0>提示 {0}：</0>多个类别对比等份 → 卡方拟合优度检验。", "<0>Hint {0}:</0> Single wait times are skewed, but averages of many waits are not.": "<0>提示 {0}：</0>单次等待时间是偏态的，但多次等待的平均值不是。", "<0>Hint {0}:</0> Small p-value = the data disagree with the claim.": "<0>提示 {0}：</0>p 值小 = 数据与该说法不符。", "<0>Hint {0}:</0> Subtract what you pay to play.": "<0>提示 {0}：</0>减去你为参与所付的钱。", "<0>Hint {0}:</0> The mean uses every value, so one extreme value pulls it.": "<0>提示 {0}：</0>均值用到每个数值，所以一个极端值就会拉动它。", "<0>Hint {0}:</0> The median and IQR only use the middle of the data.": "<0>提示 {0}：</0>中位数和四分位距只用到数据的中间部分。", "<0>Hint {0}:</0> The spread of the means should be close to σ/√n.": "<0>提示 {0}：</0>均值的分散程度应接近 σ/√n。", "<0>Hint {0}:</0> Training R² always goes up when you add predictors, even useless ones.": "<0>提示 {0}：</0>增加预测变量时训练 R² 总会上升，即使变量毫无用处。", "<0>Hint {0}:</0> Training accuracy can be misleading; test accuracy is the honest score.": "<0>提示 {0}：</0>训练准确率可能具有误导性；测试准确率才是可靠的分数。", "<0>Hint {0}:</0> Very small k overfits; very large k underfits.": "<0>提示 {0}：</0>k 很小会过拟合；k 很大会欠拟合。", "<0>Hint {0}:</0> With few rolls, big differences happen by chance.": "<0>提示 {0}：</0>掷的次数少时，偶然也会出现很大的差异。", "<0>Hint {0}:</0> z = (result − mean) ÷ SD.": "<0>提示 {0}：</0>z =（成绩 − 均值）÷ 标准差。", "<0>Hours studied</0> vs <1>Exam mark</1>": "<0>学习时长</0>与<1>考试成绩</1>", "<0>Ice cream sales</0> vs <1>Sunburn cases</1>": "<0>冰淇淋销量</0>与<1>晒伤病例数</1>", "<0>Number of firefighters at a fire</0> vs <1>Damage cost</1>": "< function gser(a,x){let sum=1/a,del=sum,ap=a;for(let n=0;n<300;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-12)break}return sum*Math.exp(-x+a*Math.log(x)-lgamma(a))}
function gcf(a,x){let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-12)break}return Math.exp(-x+a*Math.log(x)-lgamma(a))*h}
S.chip = (x,df) => {if(x<=0)return 1;const a=df/2,xx=x/2;return xx<a+1?1-gser(a,xx):gcf(a,xx)};
S.binom = (n,k,p) => {let c=1;for(let i=0;i<k;i++)c=c*(n-i)/(i+1);return c*p**k*(1-p)**(n-k)};
S.pois = (l,k) => {let r=Math.exp(-l);for(let i=1;i<=k;i++)r*=l/i;return r};

C.yaxis = (sy,x,lo,hi,step,fmt=v=>v) => {let s=`<line x1="${x}" x2="${x}" y1="${sy(lo)}" y2="${sy(hi)}" stroke="var(--line)"/>`;for(let t=lo;t<=hi+1e-9;t+=step){const v=+t.toFixed(6);s+=`<line x1="${x-4}" x2="${x}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text class="axis" x="${x-6}" y="${sy(v)+3}" text-anchor="end">${fmt(v)}</text>`}return s};

C.bars = (labels,vals,opts={}) => {const H=opts.h||170,b=H-34,t=12,L=30,R=C.W-8,mx=opts.max||Math.max(1,...vals),bw=(R-L)/vals.length;let s="";const sy=C.scale(0,mx,b,t);s+=C.yaxis(sy,L,0,mx,niceStep(mx),v=>opts.pct?Math.round(v*100)+"%":+v.toFixed(2));vals.forEach((v,i)=>{s+=`<rect x="${L+i*bw+bw*0.15}" y="${sy(v)}" width="${bw*0.7}" height="${b-sy(v)}" rx="2" fill="${(opts.colors&&opts.colors[i])||"var(--mean)"}"/><text class="axis" x="${L+i*bw+bw/2}" y="${b+14}" text-anchor="middle">${A.esc(labels[i])}</text>`});if(opts.ref!=null)s+=`<line x1="${L}" x2="${R}" y1="${sy(opts.ref)}" y2="${sy(opts.ref)}" stroke="var(--curve)" stroke-dasharray="4 3" stroke-width="1.5"/>`;return C.svg(H,s,opts.label)};
function niceStep(mx){const raw=mx/4,p=10**Math.floor(Math.log10(raw)),m=raw/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}
C.nice = niceStep;

const trackQ=[];let trackT=null,trackTries=0;
const trackOn=()=>!!(window.SS_CONFIG&&window.SS_CONFIG.analyticsCode);
const trackFlush=()=>{if(window.goatcounter&&window.goatcounter.count){while(trackQ.length){try{window.goatcounter.count(trackQ.shift())}catch(e){}}clearInterval(trackT);trackT=null}else if(++trackTries>40){trackQ.length=0;clearInterval(trackT);trackT=null}};
A.track = (path,title) => {if(!trackOn()&&!(window.goatcounter&&window.goatcounter.count))return;trackQ.push({path,title:title||path,event:true});if(trackQ.length>50)trackQ.shift();trackFlush();if(trackQ.length&&!trackT){trackTries=0;trackT=setInterval(trackFlush,500)}};
A.award = (gameId,points,max) => {
  A.track("finish/"+gameId);
  const prev=A.best[gameId];
  if(!prev||points>prev.points){A.best[gameId]={points,max};store.set("best",A.best)}
  if(A.pool.db&&A.pool.canWrite&&A.me.team&&points>0){
    A.pool.db.collection("plays").add({round:A.pool.round,game:gameId,team:A.me.team,points,at:Date.now()}).catch(err=>{if(err&&err.code==="invalid_argument"){A.pool.canWrite=false;poolChanged()}});
  }
  if(!A.pool.db){A.toast(`You scored ${points}/${max}. Best scores are saved on this device.`);return}
  A.toast(A.me.team?`+${points} points for ${A.TEAMS.find(t=>t.id===A.me.team).name}`:`You scored ${points}. Pick a team on the home screen to earn team points.`);
};
async function connect(){
  const use=window.claude&&window.claude.use?n=>window.claude.use(n):async()=>null;
  let db=null,user=null;
  try{[db,user]=await Promise.all([use("db"),use("user")])}catch(e){}
  if(user){try{A.pool.canEdit=!!(await user.canEdit())}catch(e){}try{if((await user.can("data.write"))===false)A.pool.canWrite=false}catch(e){}}
  if(!db){A.pool.state="local";poolChanged();return}
  A.pool.db=db;
  let unsub=null;const timer=setTimeout(()=>{if(A.pool.state==="connecting"){A.pool.state="stale";poolChanged()}},10000);
  const watch=()=>{if(unsub)unsub();A.pool.plays=[];
    unsub=db.collection("plays").where("round","==",A.pool.round).limit(1000).onSnapshot(snap=>{
      A.pool.plays=snap.docs.map(d=>d.data()||{}).filter(p=>A.TEAMS.some(t=>t.id===p.team)&&typeof p.points==="number"&&p.points>=0&&p.points<=200);
      if(!snap.metadata.fromCache){A.pool.state="live";clearTimeout(timer)}poolChanged();
    },()=>{clearTimeout(timer);A.pool.state="local";A.pool.db=null;poolChanged()})};
  db.doc("settings/round").onSnapshot(snap=>{const d=snap.exists?snap.data():null;const r=d&&typeof d.round==="string"&&/^r\d+$/.test(d.round)?d.round:"r0";if(r!==A.pool.round||!unsub){A.pool.round=r;watch();poolChanged()}},()=>{if(!unsub)watch()});
}
A.statusText = () => ({connecting:"Connecting to the class pool…",
  live:A.pool.canWrite?"Live: your points and class data join the class pool.":"Live, view-only: you can watch the class, but your results stay on this device.",
  stale:"The class pool hasn't answered yet. Your results are saved on this device.",
  local:"Solo mode: your best scores are saved on this device only."})[A.pool.state];

A.hintUI=(box,penalty,onUse)=>{const hs=A.curHints||[];if(!hs.length)return;let k=0;
  const wrap=A.h("div",{class:"hintwrap",style:"display:flex;flex-direction:column;gap:8px"},`<button class="btn ghost hintbtn" type="button" style="align-self:flex-start">Show a hint${penalty?" (half points for this question)":""}</button><div class="hints"></div>`);

/* ---------- quiz engine ---------- */
/* cfg: {id, intro, n, gen(i) -> {role?, html, choices[], answer, explain, after?}, points=10} */
A.quiz = (el,cfg) => {
  const pts=cfg.points||10;let hinted=false,i=0,score=0,res=[],q=null,step=0;
  const box=A.h("div",{class:"card"});el.appendChild(box);
  const start=()=>{i=0;score=0;res=[];next()};
  const next=()=>{q=cfg.gen(i);step=0;draw()};
  const cur=()=>q.steps?q.steps[step]:q;
  function draw(){
    const s=cur();
    box.innerHTML=`<div class="row between"><div class="dots">${Array.from({length:cfg.n},(_,k)=>`<i class="${k<res.length?(res[k]?"ok":"no"):k===i?"cur":""}"></i>`).join("")}</div><span class="num lead">${score} pts</span></div>`+
      (q.role?`<span class="role">Your role: ${A.esc(q.role)}</span>`:"")+
      (step===0&&q.html?`<div class="stem">${q.html}</div>`:"")+(s.html&&q.steps?`<div class="stem">${s.html}</div>`:"")+
      `<div class="choices">${s.choices.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join("")}</div><div class="fb"></div>`;
    box.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
    hinted=false;A.hintUI(box.querySelector(".fb").parentNode.insertBefore(A.h("div"),box.querySelector(".fb")),true,()=>{hinted=true});
  }
  function answer(k){
    const s=cur(),ok=k===s.answer;
    box.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===s.answer)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
    const last=!q.steps||step===q.steps.length-1;
    const hw=box.querySelector(".hintwrap .hintbtn");if(hw)hw.disabled=true;
    if(ok)score+=Math.round((q.steps?pts/q.steps.length:pts)*(hinted?0.5:1));
    const fb=box.querySelector(".fb");
    fb.innerHTML=`<div class="feedback ${ok?"":"no"}"><p><strong>${ok?"Correct.":"Not quite."}</strong></p><p>${s.explain||""}</p></div><div class="row" style="margin-top:10px"><button class="btn" id="qn">${last?(i===cfg.n-1?"See results":"Next"):"Continue"}</button></div>`;
    if(q.steps&&!ok)q._miss=true;
    box.querySelector("#qn").addEventListener("click",()=>{
      if(!last){step++;draw();return}
      res.push(q.steps?!q._miss:ok);i++;
      if(i<cfg.n)next();else finish();
    });
  }
  function finish(){
    const max=cfg.n*pts;A.award(cfg.id,score,max);
    box.innerHTML=`<h2>${score} / ${max} points</h2><p class="lead">${score>=max*0.8?"Excellent work.":score>=max*0.5?"Good effort. Play again to lock in the ideas.":"Tricky one. Talk the explanations through with your team, then try again."}</p><div class="row"><button class="btn" id="again">Play again</button></div>`;
    box.querySelector("#again").addEventListener("click",start);
  }
  if(cfg.intro){box.innerHTML=`<p>${cfg.intro}</p><div class="row"><button class="btn" id="go">Start</button></div>`;box.querySelector("#go").addEventListener("click",start)}else start();
};
/* score helper for interactive games: n rounds, custom per-round scoring */
A.rounds = (el,cfg) => { /* cfg: {id,n,max,render(box,api)} api:{round,add(points),next()} */
  let r=0,score=0;const box=A.h("div",{class:"card"});el.appendChild(box);
  const api={get round(){return r},add:p=>{score+=p},get score(){return score},
    next:()=>{r++;if(r<cfg.n)paint();else{const max=cfg.n*cfg.max;A.award(cfg.id,Math.round(score),max);box.innerHTML=`<h2>${Math.round(score)} / ${max} points</h2><p class="lead">${score>=max*0.8?"Excellent work.":"Play again to sharpen your eye."}</p><div class="row"><button class="btn" id="again">Play again</button></div>`;box.querySelector("#again").addEventListener("click",()=>{r=0;score=0;paint()})}}};
  const paint=()=>{box.innerHTML=`<div class="row between"><span class="eyebrow">Round ${r+1} of ${cfg.n}</span><span class="num lead">${Math.round(score)} pts</span></div><div class="body" style="display:flex;flex-direction:column;gap:12px"></div><div class="hb"></div>`;cfg.render(box.querySelector(".body"),api);A.hintUI(box.querySelector(".hb"),false)};
  paint();
};
A.mc = (choices,answer) => { /* shuffle choices keeping answer */ const idx=S.shuffle(choices.map((_,k)=>k));return {choices:idx.map(k=>choices[k]),answer:idx.indexOf(answer)} };

function caseGen(){
 const t=S.int(0,3);const alpha=S.pick([0.05,0.01]);

 if(t===1){const n=100,k=S.pick([55,58,61,64]),z=(k/n-0.5)/Math.sqrt(0.25/n),p=2*(1-S.ncdf(Math.abs(z)));
  return {story:`A coin is accused of being unfair. In ${n} flips it lands heads ${k} times.`,h0:"H₀: p = 0.5",bad:["H₀: p ≠ 0.5","H₀: p̂ = "+(k/n)],stat:`z = ${f(z)}`,p,alpha}}
 if(t===2){const tt=S.pick([0.8,1.6,2.3,3.1]),df=58,p=S.tp2(tt,df);
  return {story:`A new teaching method is trialled. 30 students get it, 30 get the old method. The new group's average exam mark is higher.`,h0:"H₀: μ_new = μ_old",bad:["H₀: μ_new > μ_old","H₀: x̄_new = x̄_old"],stat:`two-sample t = ${tt}, df = ${df}`,p,alpha}}
 const z=S.pick([0.9,1.7,2.4,3.0]),p=2*(1-S.ncdf(z));
 return {story:`A drug trial: recovery rates are compared between the drug group and a placebo group.`,h0:"H₀: p_drug = p_placebo",bad:["H₀: p_drug > p_placebo","H₀: the drug works"],stat:`z = ${z}`,p,alpha}}

 blurb:"Put the null hypothesis on trial: evidence, verdict, and the errors courts make.",

 for(let i=0;i<2;i++)for(let j=0;j<2;j++){ssAB+=r*(m[i][j]-mA[i]-mB[j]+G)**2;cells[i][j].forEach(y=>ssE+=(y-m[i][j])**2)}

function ols(X,y){ /* X rows without intercept */

function invert(m){const n=m.length,a=m.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);

 ()=>{const yrs=["2015","2016","2020","2024"],v=[10,12,20,30],sx=i=>60+i*90,sy=C.scale(0,32,150,14);let s=`<path d="${v.map((x,i)=>(i?"L":"M")+sx(i)+" "+sy(x)).join("")}" fill="none" stroke="var(--mean)" stroke-width="2.5"/>`+v.map((x,i)=>`<circle cx="${sx(i)}" cy="${sy(x)}" r="4" fill="var(--mean)"/><text class="axis" x="${sx(i)}" y="166" text-anchor="middle">${yrs[i]}</text>`).join("")+C.yaxis(sy,40,0,30,10);
  return {svg:C.svg(176,s,"Line chart"),q:"Enrolments over time. What's misleading?",c:["The years are evenly spaced but the gaps are 1, 4 and 4 years","The line should be a bar chart","The y-axis starts at 0"],e:"Unequal time gaps drawn as equal distances distort the growth rate. Space the x-axis by actual time."}},
 ()=>{const sy=C.scale(0,400,150,14),cum=[80,150,210,260,300,330];let s=`<path d="${cum.map((x,i)=>(i?"L":"M")+(50+i*55)+" "+sy(x)).join("")}" fill="none" stroke="var(--mean)" stroke-width="2.5"/>`+cum.map((x,i)=>`<text class="axis" x="${50+i*55}" y="166" text-anchor="middle">M${i+1}</text>`).join("")+C.yaxis(sy,40,0,400,100);
  return {svg:C.svg(176,s,"Cumulative sales"),q:"“Sales keep rising!” says the report. What's hidden?",c:["It's a cumulative total, which hides that monthly sales are falling","Nothing, sales are rising","The months are mislabelled"],e:"Monthly sales were 80, 70, 60, 50, 40, 30. A cumulative chart always rises, so it hides the decline."}},
 ()=>{let s=`<circle cx="100" cy="90" r="25" fill="var(--pop)"/><text class="axis" x="100" y="160" text-anchor="middle">2023: 100 users</text><circle cx="250" cy="90" r="50" fill="var(--pop)"/><text class="axis" x="250" y="160" text-anchor="middle">2024: 200 users</text>`;
  return {svg:C.svg(170,s,"Bubble chart"),q:"Users doubled. What's misleading about the circles?",c:["The radius doubled, so the area is 4 times bigger","Circles should be squares","The colours are the same"],e:"Readers judge area. Doubling the radius quadruples the area, overstating growth. Scale area to the value, or use bars."}},
 ()=>{const sy=C.scale(60,80,150,14),v=[62,64,68,73,77];let s=`<path d="${v.map((x,i)=>(i?"L":"M")+(60+i*60)+" "+sy(x)).join("")}" fill="none" stroke="var(--mean)" stroke-width="2.5"/>`+v.map((x,i)=>`<text class="axis" x="${60+i*60}" y="166" text-anchor="middle">Wk ${i+1}</text>`).join("")+C.yaxis(sy,40,60,80,5);
  return {svg:C.svg(176,s,"Line chart"),q:"“Satisfaction is soaring!” It shows 5 weeks after a 2-year decline. What's the issue?",c:["Cherry-picked time window","The y-axis is too wide","Weeks should be days"],e:"Choosing a short window can make any trend look good. Show the full history so readers see the context."}}];
A.reg({id:"chart-makeover",title:"Chart Makeover",mode:"After class",units:[["ds",[3]],["intro",[1]]],topics:"data visualisation misleading graphs axis scale communication",
 blurb:"Find what's wrong with a misleading chart and learn how to fix it.",
 how:"Each chart tells a misleading story. Spot the trick, then read how to redesign it honestly. Share your best redesign idea with the class.",
 mount(el){const order=S.shuffle(CH);A.quiz(el,{id:"chart-makeover",n:order.length,gen:i=>{const c=order[i]();return {html:c.svg+`<p><strong>${c.q}</strong></p>`,...A.mc(c.c,0),explain:c.e}}})}});

/* ---------- Classifier Arena ---------- */
A.reg({id:"classifier-arena",title:"Classifier Arena",mode:"Both",units:[["ds",[5]]],topics:"classification k-nearest neighbours k-means clustering accuracy overfitting machine learning",
 blurb:"Tune k-nearest neighbours and k-means and see what happens to accuracy.",
 how:"Part 1: classify students as likely to finish a degree (blue) or not (pink) using k-nearest neighbours. Compare training and test accuracy as k changes. Part 2: group unlabelled data with k-means.",
 mount(el){
  const gen=n=>Array.from({length:n},()=>{const c=S.r()<0.5?1:0;const x=c?S.norm(6,1.6):S.norm(4,1.6),y=c?S.norm(6,1.6):S.norm(4,1.6);return {x,y,c}});
  const train=gen(80),test=gen(80);let k=1,K=3;
  const blobs=[[2.5,3],[7,3],[5,7.5]].flatMap(([cx,cy])=>Array.from({length:30},()=>({x:S.norm(cx,0.9),y:S.norm(cy,0.9)})));
  el.innerHTML=`<section class="card"><h2>Part 1 · k-nearest neighbours</h2><div class="row"><span class="eyebrow">k</span><div class="seg" id="ks"></div></div><div id="kp"></div><div class="stats" id="ka"></div></section>
   <section class="card"><h2>Part 2 · k-means clustering</h2><div class="row"><span class="eyebrow">Clusters K</span><div class="seg" id="Ks"></div></div><div id="mp"></div><div id="el"></div></section><div id="qz"></div>`;
  const pred=(p,K_)=>{const d=train.map(t=>({d:(t.x-p.x)**2+(t.y-p.y)**2,c:t.c})).sort((a,b)=>a.d-b.d).slice(0,K_);return d.filter(z=>z.c).length*2>K_?1:0};
  const acc=(set,K_,self)=>set.filter(p=>{if(!self)return pred(p,K_)===p.c;const d=train.filter(t=>t!==p).map(t=>({d:(t.x-p.x)**2+(t.y-p.y)**2,c:t.c}));d.push({d:0,c:p.c});d.sort((a,b)=>a.d-b.d);return (d.slice(0,K_).filter(z=>z.c).length*2>K_?1:0)===p.c}).length/set.length;
  const sx=C.scale(0,10,10,C.W-10),sy=C.scale(0,10,190,10);
  const paintK=()=>{el.querySelector("#ks").innerHTML=[1,3,7,15,31].map(v=>`<button data-k="${v}" aria-pressed="${k===v}">${v}</button>`).join("");
   let s="";for(let gx=0;gx<20;gx++)for(let gy=0;gy<20;gy++){const p={x:gx*0.5+0.25,y:gy*0.5+0.25};s+=`<rect x="${sx(gx*0.5)}" y="${sy(gy*0.5+0.5)}" width="${sx(0.5)-sx(0)+0.5}" height="${sy(0)-sy(0.5)+0.5}" fill="${pred(p,k)?"var(--t1)":"var(--t2)"}" opacity=".13"/>`}
   s+=train.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="${p.c?"var(--t1)":"var(--t2)"}"/>`).join("");
   el.querySelector("#kp").innerHTML=C.svg(200,s,"kNN decision regions");
   el.querySelector("#ka").innerHTML=`<div class="stat"><b>${Math.round(acc(train,k,true)*100)}%</b><span>training accuracy</span></div><div class="stat"><b>${Math.round(acc(test,k)*100)}%</b><span>test accuracy</span></div><div class="stat"><b>${k}</b><span>neighbours voting</span></div>`};
  const kmeans=K_=>{let cen=S.shuffle(blobs).slice(0,K_).map(p=>({x:p.x,y:p.y})),lab=[];for(let it=0;it<25;it++){lab=blobs.map(p=>{let b=0,bd=1e9;cen.forEach((c,j)=>{const d=(c.x-p.x)**2+(c.y-p.y)**2;if(d<bd){bd=d;b=j}});return b});cen=cen.map((c,j)=>{const m=blobs.filter((_,i)=>lab[i]===j);return m.length?{x:S.mean(m.map(p=>p.x)),y:S.mean(m.map(p=>p.y))}:c})}
   const wss=blobs.reduce((s,p,i)=>s+(p.x-cen[lab[i]].x)**2+(p.y-cen[lab[i]].y)**2,0);return {cen,lab,wss}};
  const cols=["var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--ink)"];
  const wssAll=[1,2,3,4,5].map(K_=>Math.min(...[0,1,2,3,4].map(()=>kmeans(K_).wss)));
  const paintM=()=>{el.querySelector("#Ks").innerHTML=[2,3,4,5].map(v=>`<button data-K="${v}" aria-pressed="${K===v}">${v}</button>`).join("");
   const r=kmeans(K);let s=blobs.map((p,i)=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="${cols[r.lab[i]]}"/>`).join("")+r.cen.map(c=>`<path d="M${sx(c.x)-6} ${sy(c.y)-6}L${sx(c.x)+6} ${sy(c.y)+6}M${sx(c.x)+6} ${sy(c.y)-6}L${sx(c.x)-6} ${sy(c.y)+6}" stroke="var(--ink)" stroke-width="2.5"/>`).join("");
   el.querySelector("#mp").innerHTML=C.svg(200,s,"k-means clusters");
   el.querySelector("#el").innerHTML=`<p class="lead" style="font-size:.85rem">Within-cluster spread for K = 1 to 5. Look for the “elbow” where adding clusters stops helping much.</p>`+C.bars(["1","2","3","4","5"],wssAll,{label:"Within-cluster sum of squares",colors:wssAll.map((_,i)=>i+1===K?"var(--curve)":"var(--mean)")})};
  paintK();paintM();
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.k){k=+b.dataset.k;paintK()}if(b.dataset.K){K=+b.dataset.K;paintM()}});
  const Q=[{html:"<p>With k = 1, training accuracy is 100%. Why isn't that impressive?</p>",choices:["Each training point is its own nearest neighbour, so it memorises the data","k = 1 is always the best model","The test set is too small"],explain:"k = 1 overfits: jagged regions fit the training noise. Test accuracy is the honest measure."},
   {html:"<p>What happens as k gets very large (e.g. 31)?</p>",choices:["Boundaries get smoother; too large and the model underfits","The model always gets more accurate","Training accuracy reaches 100%"],explain:"Large k averages over many neighbours, smoothing boundaries. Too large and it misses real structure."},
   {html:"<p>For k-means here, which K does the elbow suggest?</p>",choices:["3","5","1"],explain:"The within-cluster spread drops sharply up to K = 3, then flattens. The data were generated from 3 groups."},
   {html:"<p>How does k-means differ from k-nearest neighbours?</p>",choices:["k-means finds groups in unlabelled data; kNN predicts known labels","They are the same method","k-means needs labelled training data"],explain:"kNN is supervised classification; k-means is unsupervised clustering."}];
  A.quiz(el.querySelector("#qz"),{id:"classifier-arena",n:Q.length,intro:"<strong>Check your understanding</strong> after trying different k and K values.",gen:i=>({...Q[i],...A.mc(Q[i].choices,0)})});
 }});

const FAIR=[
 {s:`<p>A bank's loan model approves applicants as follows. Both groups repay at the same rate when given loans.</p>${tbl(["Group","Applicants","Approved"],[["Group A","1,000","60%"],["Group B","1,000","35%"]])}`,q:"What concern should the council raise first?",c:["A large gap in approval rates between groups with equal repayment","The model is too accurate","Group B applied less often"],e:"Unequal approval rates for equally creditworthy groups (a demographic parity gap) suggest the model disadvantages Group B."},
 {s:`<p>Among people who <strong>would have repaid</strong> a loan:</p>${tbl(["Group","Wrongly rejected"],[["Group A","10%"],["Group B","30%"]])}`,q:"Which fairness measure is violated?",c:["Equal opportunity: false negative rates differ","Overall accuracy","Approval rates are equal"],e:"Good applicants in Group B are three times as likely to be wrongly rejected. Equal opportunity asks these error rates to match."},
 {s:"<p>The model doesn't use ethnicity, but it does use postcode, which is strongly linked to ethnicity in this city.</p>",q:"What's the council's best response?",c:["Treat postcode as a possible proxy, audit outcomes by group, and test the model without it","Nothing: ethnicity isn't in the model","Add ethnicity to make it more accurate"],e:"Removing a sensitive variable isn't enough when a proxy carries the same information. Audit the outcomes."},
 {s:"<p>A university wants to share students' grades and wellbeing survey answers with a tech company to build a dropout-prediction app.</p>",q:"What must happen first?",c:["Informed consent or a lawful basis, de-identification, and limits on how the data can be used","Nothing, if the app helps students","Share it all, then ask for consent later"],e:"Privacy law and ethics require a lawful purpose, minimal and de-identified data, and clear limits on reuse."},
 {s:`<p>A model's overall accuracy is 90%.</p>${tbl(["Subgroup","Share of data","Accuracy"],[["Majority","90%","93%"],["Minority","10%","63%"]])}`,q:"What does this show?",c:["High overall accuracy can hide poor performance for smaller groups","The model is fair because it's 90% accurate","The minority group should be removed"],e:"Always evaluate by subgroup. The overall number is dominated by the larger group."}];
A.reg({id:"fair-algorithm-council",title:"Fair Algorithm Council",mode:"In class",units:[["ds",[6]]],topics:"ethics fairness bias privacy algorithm confusion matrix accountability",
 blurb:"Role-play a council judging an algorithm for bias and privacy.",
 how:"Your team is the council. Each case, a different member takes the lead role and argues from that view before the team decides.",
 mount(el){A.quiz(el,{id:"fair-algorithm-council",n:FAIR.length,gen:i=>{const c=FAIR[i];return {role:["Applicant advocate","Data scientist","Regulator","Bank manager","Student rep"][i],html:c.s+`<p style="margin-top:8px"><strong>${c.q}</strong></p>`,...A.mc(c.c,0),explain:c.e}}})}});
})();
